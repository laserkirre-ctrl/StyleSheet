const b2u=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const SK="pnp-gate-"+P.salt.slice(0,10);
async function dec(key){
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(P.iv)},key,b2u(P.ct));
  const html=new TextDecoder().decode(buf);
  // document.open() wird ignoriert, solange der Parser noch läuft -> erst nach load + Tick ersetzen
  await new Promise(res=>{const go=()=>setTimeout(res,0);document.readyState==="complete"?go():addEventListener("load",go,{once:true})});
  document.open();document.write(html);document.close();
}
async function fromPw(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(P.salt),iterations:P.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  try{const raw=localStorage.getItem(SK);if(raw){const key=await crypto.subtle.importKey("raw",b2u(raw),"AES-GCM",false,["decrypt"]);await dec(key);return}}catch(e){try{localStorage.removeItem(SK)}catch(x){}}
})();
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();const go=document.getElementById("go"),err=document.getElementById("err");
  go.disabled=true;err.textContent="";
  try{
    const key=await fromPw(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){try{const r=new Uint8Array(await crypto.subtle.exportKey("raw",key));let s="";r.forEach(x=>s+=String.fromCharCode(x));localStorage.setItem(SK,btoa(s))}catch(x){}}
    await dec(key);
  }catch(x){err.textContent="Falsches Passwort.";go.disabled=false}
};
})();
